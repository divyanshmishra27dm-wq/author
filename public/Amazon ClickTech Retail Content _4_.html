<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>AI FLUENCY PROGRAM — LEVEL 1</title>
  <style>
/* HDFC Academy Day 2 — Mobile-First SCORM 2004 Stylesheet */
:root {
  --hdfc-navy: #002D5A;
  --hdfc-blue: #004C8F;
  --hdfc-blue-light: #EBF3FA;
  --hdfc-red: #ED232A;
  --hdfc-red-soft: #FFF5F5;
  --green: #0E8A4E;
  --green-soft: #E7F7EF;
  --amber: #D97706;
  --amber-soft: #FFF9EB;
  --bg: #F3F6FA;
  --card: #FFFFFF;
  --text: #132238;
  --muted: #52647A;
  --border: #DCE5F0;
  --radius: 16px;
  --shadow: 0 4px 16px rgba(0, 45, 90, 0.06);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

/* Sticky Mobile & Desktop Header — Full-width bleed with aligned inner content */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: var(--hdfc-navy);
  color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  box-shadow: 0 4px 18px rgba(0, 20, 45, 0.22);
}

@media (min-width: 1072px) {
  .top-bar {
    padding-left: calc((100% - 1040px) / 2);
    padding-right: calc((100% - 1040px) / 2);
  }
}

.top-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn.dark {
  background: #F1F5F9;
  border-color: #CBD5E1;
  color: var(--hdfc-navy);
  font-weight: 800;
}

.brand-lockup { flex: 1; min-width: 0; }
.brand-pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: var(--hdfc-red);
  color: #fff;
  padding: 2px 7px;
  border-radius: 5px;
  margin-bottom: 2px;
}
.header-title {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.score-pill {
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #63E6BE;
  font-weight: 800;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 20px;
  flex-shrink: 0;
}

.progress-track {
  height: 5px;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #38D9A9, #63E6BE);
  transition: width 0.35s ease;
}

.sub-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: #B8D4F0;
  margin-top: 5px;
}
.lms-status {
  background: rgba(14, 138, 78, 0.28);
  color: #8CE99A;
  padding: 1px 7px;
  border-radius: 99px;
  font-weight: 700;
}

/* Navigation Drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 20, 40, 0.58);
  z-index: 60;
}
.drawer-backdrop.hidden { display: none; }

.nav-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(86vw, 350px);
  background: #fff;
  z-index: 70;
  transform: translateX(-105%);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 8px 0 30px rgba(0, 0, 0, 0.25);
}
.nav-drawer.open { transform: translateX(0); }

.drawer-header {
  padding: 16px;
  background: var(--hdfc-navy);
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.drawer-kicker { font-size: 10.5px; font-weight: 800; color: #8CC5FF; letter-spacing: 0.08em; }
.drawer-title { font-size: 16px; font-weight: 800; margin-top: 2px; }

.drawer-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 12px 14px;
  background: #F8FAFD;
  border-bottom: 1px solid var(--border);
}
.stat-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
}
.stat-val { display: block; font-size: 15px; font-weight: 800; color: var(--hdfc-blue); }
.stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }

.module-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.mod-item {
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.mod-item.active {
  border-color: var(--hdfc-blue);
  background: var(--hdfc-blue-light);
}
.mod-num {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--hdfc-navy);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.mod-item.done .mod-num { background: var(--green); }
.mod-meta { flex: 1; min-width: 0; }
.mod-name { font-size: 13.5px; font-weight: 700; color: var(--text); display: block; }
.mod-sub { font-size: 11.5px; color: var(--muted); display: block; }

.drawer-footer {
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}
.btn-finish {
  width: 100%;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
}

/* Main Content — Centered responsive reading container up to 1040px */
.main-content {
  flex: 1;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: 22px 20px 110px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

@media (max-width: 640px) {
  .main-content {
    padding: 14px 14px 96px;
    gap: 14px;
  }
}

/* Hero Banner */
.chapter-hero {
  background: linear-gradient(135deg, var(--hdfc-navy) 0%, var(--hdfc-blue) 100%);
  color: #fff;
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.chapter-hero::after {
  content: "";
  position: absolute;
  top: -30px;
  right: -30px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(237, 35, 42, 0.25);
}
.hero-kicker {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.16);
  padding: 3px 9px;
  border-radius: 6px;
  margin-bottom: 8px;
}
.hero-title {
  margin: 0 0 6px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.25;
}
.hero-desc {
  margin: 0;
  font-size: 14px;
  color: #DCEBFF;
}

/* Visual Infographic Card */
.visual-card {
  margin: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  box-shadow: var(--shadow);
}
.visual-card img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
}
.visual-caption {
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Standard Content Card */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--hdfc-blue);
  background: var(--hdfc-blue-light);
  padding: 3px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.card-tag.red { color: #9B1C1C; background: var(--hdfc-red-soft); }
.card-tag.green { color: #085931; background: var(--green-soft); }
.card-tag.amber { color: #7A5200; background: var(--amber-soft); }

/* Card Top-Right Small Speaker Button */
.card-speaker-corner {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
}
.card-audio-speaker-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #F0F5FA;
  border: 1px solid #C8DDF2;
  color: var(--hdfc-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0, 45, 90, 0.08);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 0;
  outline: none;
}
.card-audio-speaker-btn:hover {
  background: var(--hdfc-blue);
  border-color: var(--hdfc-blue);
  color: #ffffff;
  transform: scale(1.08);
  box-shadow: 0 3px 8px rgba(0, 76, 143, 0.25);
}
.card-audio-speaker-btn:active {
  transform: scale(0.94);
}
.card-audio-speaker-btn .speaker-playing {
  display: none;
}
.card-audio-speaker-btn.is-playing {
  background: var(--hdfc-blue);
  border-color: var(--hdfc-navy);
  color: #ffffff;
  box-shadow: 0 0 0 4px rgba(0, 76, 143, 0.25), 0 2px 8px rgba(0, 45, 90, 0.3);
  animation: speaker-pulse 1.8s infinite ease-in-out;
}
.card-audio-speaker-btn.is-playing .speaker-idle {
  display: none;
}
.card-audio-speaker-btn.is-playing .speaker-playing {
  display: block;
}
@keyframes speaker-pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 76, 143, 0.4); }
  50% { transform: scale(1.07); box-shadow: 0 0 0 6px rgba(0, 76, 143, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 76, 143, 0); }
}
.card-hidden-audio {
  display: none !important;
}

.card:has(.card-speaker-corner) h2,
.card-speaker-corner + h2,
.card-speaker-corner ~ h2 {
  padding-right: 36px;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 17.5px;
  font-weight: 800;
  color: var(--hdfc-navy);
  line-height: 1.3;
}
.card h3 {
  margin: 12px 0 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--hdfc-blue);
}
.card p { margin: 0 0 10px; font-size: 14.5px; }
.card p:last-child { margin-bottom: 0; }

/* Rich Lists */
.rich-list {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rich-list li {
  position: relative;
  padding-left: 20px;
  font-size: 14.5px;
  line-height: 1.5;
}
.rich-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--hdfc-blue);
}
.rich-list.red li::before { background: var(--hdfc-red); }
.rich-list.green li::before { background: var(--green); }

/* Callout Boxes */
.callout {
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 10px;
  font-size: 14px;
  border-left: 4px solid var(--hdfc-blue);
  background: var(--hdfc-blue-light);
}
.callout.warn {
  border-left-color: var(--hdfc-red);
  background: var(--hdfc-red-soft);
  color: #5C1D1D;
}
.callout.tip {
  border-left-color: var(--green);
  background: var(--green-soft);
  color: #084C2B;
}
.callout.think {
  border-left-color: var(--amber);
  background: var(--amber-soft);
  color: #4D3600;
}

/* Accordions for Deep Content */
.acc-group {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 10px;
}
details.acc-item {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: #FAFBFD;
  overflow: hidden;
}
details.acc-item[open] {
  border-color: var(--hdfc-blue);
  background: #fff;
}
details.acc-item summary {
  list-style: none;
  padding: 12px 14px;
  font-weight: 800;
  font-size: 14.5px;
  color: var(--hdfc-navy);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
details.acc-item summary::-webkit-details-marker { display: none; }
details.acc-item summary::after {
  content: "+";
  font-size: 18px;
  font-weight: 800;
  color: var(--hdfc-blue);
  flex-shrink: 0;
}
details.acc-item[open] summary::after { content: "−"; }
.acc-body {
  padding: 0 14px 14px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  font-size: 14px;
}

/* Responsive Data Tables */
.table-wrap {
  overflow-x: auto;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
table.data-table th {
  background: var(--hdfc-navy);
  color: #fff;
  text-align: left;
  padding: 10px 11px;
  font-weight: 700;
}
table.data-table td {
  padding: 9px 11px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
table.data-table tr:nth-child(even) td { background: #F8FAFD; }

/* Roleplay Chat Dialogue */
.dialogue-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}
.msg {
  padding: 11px 13px;
  border-radius: 14px;
  font-size: 14px;
  max-width: 92%;
}
.msg.rm {
  background: var(--hdfc-blue-light);
  border: 1px solid #B8D4F0;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.msg.cust {
  background: #F1F5F9;
  border: 1px solid #CBD5E1;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg-speaker {
  display: block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
  color: var(--hdfc-navy);
}

/* Video Embed Placeholder Card */
.video-embed-card {
  background: #0B192C;
  color: #fff;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 8px 24px rgba(0, 24, 54, 0.22);
  border: 1px solid #1E3A5F;
}
.video-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.video-badge {
  background: var(--hdfc-red);
  color: #fff;
  font-size: 10.5px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.06em;
}
.video-dur {
  background: rgba(255, 255, 255, 0.14);
  color: #99C2FF;
  font-size: 11.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
}
.video-title {
  margin: 0 0 10px;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
}
.video-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  background: radial-gradient(circle at center, #143663 0%, #071324 100%);
  border: 1.5px dashed #4DABF7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 16px;
  overflow: hidden;
}
.video-stage video,
.video-stage iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 10px;
}
.play-medallion {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--hdfc-red);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 0 10px rgba(237, 35, 42, 0.25);
  margin-bottom: 10px;
}
.video-placeholder-text {
  font-size: 13.5px;
  font-weight: 700;
  color: #E2E8F0;
}
.video-placeholder-sub {
  font-size: 11.5px;
  color: #94A3B8;
  margin-top: 3px;
}
.video-watch-box {
  margin-top: 12px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 12px;
  padding: 11px 13px;
}
.video-watch-title {
  font-size: 12px;
  font-weight: 800;
  color: #63E6BE;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.video-watch-box ul {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  color: #E2E8F0;
}
.video-watch-box li { margin-bottom: 4px; }

.video-embed-tools {
  margin-top: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.video-url-input {
  flex: 1;
  min-width: 180px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 12.5px;
}
.video-url-input::placeholder { color: #94A3B8; }
.video-load-btn {
  background: #228BE6;
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}

/* Interactive Quizzes, Blanks, Matching & Sorter */
.quiz-card {
  position: relative;
  background: #fff;
  border: 2px solid #D0E1F5;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.quiz-badge {
  background: var(--hdfc-navy);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
  letter-spacing: 0.06em;
}
.q-block {
  padding: 12px 0;
  border-top: 1px solid var(--border);
}
.q-block:first-of-type { border-top: none; padding-top: 4px; }
.q-text {
  font-weight: 700;
  font-size: 14.5px;
  margin-bottom: 9px;
  color: var(--hdfc-navy);
}
.opt-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.opt-btn {
  width: 100%;
  text-align: left;
  background: #F8FAFD;
  border: 1.5px solid var(--border);
  border-radius: 11px;
  padding: 11px 13px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s ease;
}
.opt-btn.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: #085931;
  font-weight: 700;
}
.opt-btn.wrong {
  background: var(--hdfc-red-soft);
  border-color: var(--hdfc-red);
  color: #8A1717;
}
.q-feedback {
  margin-top: 8px;
  padding: 9px 11px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  background: #F1F5F9;
  color: var(--hdfc-navy);
}
.q-feedback.ok { background: var(--green-soft); color: #085931; }
.q-feedback.err { background: var(--hdfc-red-soft); color: #8A1717; }

/* Fill in the Blanks & Matching */
.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--hdfc-blue-light);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 12px;
}
.word-chip {
  background: #fff;

  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;

  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);

  border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr auto 1.2fr;
  gap: 10px;
  z-index: 35;
  box-shadow: 0 -4px 20px rgba(0, 45, 90, 0.07);

/**
 * SCORM 2004 (2nd/3rd/4th Edition) API_1484_11 Wrapper with Robust Offline & Cross-Origin Fallback
 */
var SCORM2004 = (function () {
  let api = null;
  let initialized = false;
  let terminated = false;
  const memoryStore = {};

  function getStorageKey() {
    try {
      if (typeof window !== 'undefined') {
        if (window.COURSE_STORAGE_KEY) return window.COURSE_STORAGE_KEY;
        if (window.COURSE_ID) return 'hdfc_scorm2004_' + window.COURSE_ID;
        const pathKey = (window.location && window.location.pathname)
          ? window.location.pathname.split('/').pop().replace(/[^a-zA-Z0-9_-]/g, '_')
          : 'default';
        return 'hdfc_scorm2004_' + pathKey;
      }
    } catch (e) {}
    return 'hdfc_scorm2004_default_store';
  }

  function findAPI(win) {
    let attempts = 0;
    try {
      while (win && attempts < 15) {
        try {
          if (win.API_1484_11) return win.API_1484_11;
        } catch (secErr) {
          // Cross-origin restriction hit, stop traversing up
          break;
        }
        if (!win.parent || win.parent === win) break;
        attempts++;
        win = win.parent;
      }
    } catch (e) {}
    return null;
  }

  function getAPI() {
    if (api) return api;
    try {
      api = findAPI(window);
      if (!api && window.opener) {
        try {
          api = findAPI(window.opener);
        } catch (openerErr) {}
      }
    } catch (e) {
      api = null;
    }
    return api;
  }

  function init() {
    if (initialized) return true;
    try {
      const handle = getAPI();
      if (handle) {
        const res = handle.Initialize('');
        initialized = (res === 'true' || res === true);
        if (initialized) {
          const status = getValue('cmi.completion_status');
          if (!status || status === 'unknown' || status === 'not attempted') {
            setValue('cmi.completion_status', 'incomplete');
          }
          setValue('cmi.exit', 'suspend');
          commit();
        }
      } else {
        initialized = true; // Standalone / preview mode
      }
    } catch (e) {
      initialized = true;
    }
    return initialized;
  }

  function getValue(param) {
    try {
      const handle = getAPI();
      if (handle && initialized && !terminated) {
        return handle.GetValue(param) || '';
      }
    } catch (e) {}

    try {
      const key = getStorageKey();
      const raw = localStorage.getItem(key);
      const store = raw ? JSON.parse(raw) : memoryStore;
      return store[param] || '';
    } catch (e) {
      return memoryStore[param] || '';
    }
  }

  function setValue(param, val) {
    const strVal = String(val);
    try {
      const handle = getAPI();
      if (handle && initialized && !terminated) {
        return handle.SetValue(param, strVal) === 'true';
      }
    } catch (e) {}

    memoryStore[param] = strVal;
    try {
      const key = getStorageKey();
      const raw = localStorage.getItem(key);
      const store = raw ? JSON.parse(raw) : {};
      store[param] = strVal;
      localStorage.setItem(key, JSON.stringify(store));
      return true;
    } catch (e) {
      return true;
    }
  }

  function commit() {
    try {
      const handle = getAPI();
      if (handle && initialized && !terminated) {
        return handle.Commit('') === 'true';
      }
    } catch (e) {}
    return true;
  }

  function finish() {
    if (terminated) return true;
    commit();
    try {
      const handle = getAPI();
      if (handle && initialized) {
        const res = handle.Terminate('');
        terminated = (res === 'true' || res === true);
        return terminated;
      }
    } catch (e) {}
    terminated = true;
    return true;
  }

  function saveState(stateObj) {
    try {
      setValue('cmi.suspend_data', JSON.stringify(stateObj));
      if (stateObj.currentChapter !== undefined) {
        setValue('cmi.location', String(stateObj.currentChapter));
      }
      if (typeof stateObj.progressMeasure === 'number') {
        setValue('cmi.progress_measure', stateObj.progressMeasure.toFixed(2));
      }
      if (typeof stateObj.scoreScaled === 'number') {
        setValue('cmi.score.scaled', stateObj.scoreScaled.toFixed(2));
        setValue('cmi.score.raw', String(Math.round(stateObj.scoreScaled * 100)));
        setValue('cmi.score.min', '0');
        setValue('cmi.score.max', '100');
      }
      if (stateObj.completed) {
        setValue('cmi.completion_status', 'completed');
        setValue('cmi.success_status', stateObj.scoreScaled >= 0.6 ? 'passed' : 'completed');
        setValue('cmi.exit', 'normal');
      }
      commit();
    } catch (e) {
      console.warn('saveState warning:', e);
    }
  }

  function loadState() {
    try {
      const raw = getValue('cmi.suspend_data');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function isConnected() {
    return !!getAPI();
  }

  return { init, getValue, setValue, commit, finish, saveState, loadState, isConnected };

  if (isDay3) {
    document.title = "HDFC Academy · Day 3: Know Your Product — CASA & Savings Mastery";
    const kicker = document.querySelector('.drawer-kicker');
    if (kicker) kicker.textContent = "DAY 3 CURRICULUM";
  }

  const scormApi = (typeof window !== 'undefined' && window.SCORM2004)
    ? window.SCORM2004
    : (typeof SCORM2004 !== 'undefined' ? SCORM2004 : {
        init: () => true,
        loadState: () => null,
        saveState: () => {},
        finish: () => {},
        isConnected: () => false
      });

  try {
    scormApi.init();
  } catch (initErr) {
    console.warn('SCORM init warning:', initErr);
  }

  const saved = (function() {
    try {
      return scormApi.loadState() || {};
    } catch (e) {
      return {};
    }
  })();

  // CRITICAL SANITIZATION: Never allow saved.currentChapter to exceed valid chapter bounds!
  let initialChapter = 0;
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const chParam = urlParams.get('ch');
    if (chParam !== null && !isNaN(Number(chParam))) {
      const chNum = parseInt(chParam, 10);
      if (chNum >= 0 && chNum < COURSE_CHAPTERS.length) {
        initialChapter = chNum;
      }
    } else if (typeof saved.currentChapter === 'number' && saved.currentChapter >= 0 && saved.currentChapter < COURSE_CHAPTERS.length) {
      initialChapter = saved.currentChapter;
    }
  } catch (e) {
    if (typeof saved.currentChapter === 'number' && saved.currentChapter >= 0 && saved.currentChapter < COURSE_CHAPTERS.length) {
      initialChapter = saved.currentChapter;
    }
  }

  let initialVisited = [initialChapter];
  if (Array.isArray(saved.visited)) {
    initialVisited = saved.visited.filter(i => typeof i === 'number' && i >= 0 && i < COURSE_CHAPTERS.length);
    if (!initialVisited.includes(initialChapter)) initialVisited.push(initialChapter);
  }

  const state = {
    currentChapter: initialChapter,
    visited: initialVisited,
    answers: (saved.answers && typeof saved.answers === 'object') ? saved.answers : {},
    notes: typeof saved.notes === 'string' ? saved.notes : '',
    videoPreviews: (saved.videoPreviews && typeof saved.videoPreviews === 'object') ? saved.videoPreviews : {},
    completed: !!saved.completed
  };

  const els = {
    main: document.getElementById('mainContent'),
    headerTitle: document.getElementById('headerTitle'),
    scorePill: document.getElementById('scorePill'),
    progressFill: document.getElementById('progressFill'),
    stepIndicator: document.getElementById('stepIndicator'),
    lmsBadge: document.getElementById('lmsBadge'),
    bottomTag: document.getElementById('bottomChapterTag'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    nextLabel: document.getElementById('nextBtnLabel'),
    menuBtn: document.getElementById('menuBtn'),
    closeDrawerBtn: document.getElementById('closeDrawerBtn'),
    drawer: document.getElementById('navDrawer'),
    backdrop: document.getElementById('drawerBackdrop'),
    moduleList: document.getElementById('moduleList'),
    drawerCompleted: document.getElementById('drawerCompleted'),
    drawerScore: document.getElementById('drawerScore'),
    finishCourseBtn: document.getElementById('finishCourseBtn'),
    quickIndexBtn: document.getElementById('quickIndexBtn')
  };

  els.lmsBadge.textContent = scormApi.isConnected() ? 'LMS SCORM 2004 Connected' : 'SCORM 2004 Ready';

  function computeScore() {
    let total = 0;
    let correct = 0;
    COURSE_CHAPTERS.forEach(ch => {
      ch.blocks.forEach(b => {
        if (b.type === 'quiz_mcq') {
          b.questions.forEach((q, qi) => {
            total++;
            const key = `${b.id}_q${qi}`;
            if (state.answers[key] === q.correct) correct++;
          });
        } else if (b.type === 'quiz_blanks') {
          b.items.forEach((it, bi) => {
            total++;
            const key = `${b.id}_b${bi}`;
            const val = (state.answers[key] || '').trim().toLowerCase();
            if (val === it.answer.trim().toLowerCase()) correct++;
          });
        } else if (b.type === 'quiz_match') {
          b.pairs.forEach((p, pi) => {
            total++;
            const key = `${b.id}_m${pi}`;
            if (state.answers[key] === p.answer) correct++;
          });
        } else if (b.type === 'kyc_sorter') {
          b.docs.forEach((d, di) => {
            total++;
            const key = `${b.id}_s${di}`;
            if (state.answers[key] === d.valid) correct++;
          });
        }
      });
    });
    return { total, correct, pct: total ? Math.round((correct / total) * 100) : 0 };
  }

  function persist() {
    if (!state.visited.includes(state.currentChapter)) {
      state.visited.push(state.currentChapter);
    }
    const { pct } = computeScore();
    const progressMeasure = state.visited.length / COURSE_CHAPTERS.length;
    if (progressMeasure >= 1 && !state.completed) {
      state.completed = true;
    }
    scormApi.saveState({
      currentChapter: state.currentChapter,
      visited: state.visited,
      answers: state.answers,
      notes: state.notes,
      videoPreviews: state.videoPreviews,
      completed: state.completed,
      progressMeasure,
      scoreScaled: pct / 100
    });
    updateChrome();
  }

  function updateChrome() {
    if (state.currentChapter < 0) state.currentChapter = 0;
    if (state.currentChapter >= COURSE_CHAPTERS.length) state.currentChapter = Math.max(0, COURSE_CHAPTERS.length - 1);
    const ch = COURSE_CHAPTERS[state.currentChapter] || { shortTitle: 'Module', num: '01' };
    const { pct } = computeScore();
    const visitedCount = state.visited.length;
    const progPct = Math.round((visitedCount / COURSE_CHAPTERS.length) * 100);

    if (els.headerTitle) els.headerTitle.textContent = ch.shortTitle || 'Module';
    if (els.scorePill) els.scorePill.textContent = `${pct}%`;
    if (els.progressFill) els.progressFill.style.width = `${progPct}%`;
    if (els.stepIndicator) els.stepIndicator.textContent = `Chapter ${state.currentChapter + 1} of ${COURSE_CHAPTERS.length} · ${visitedCount} Visited`;
    if (els.bottomTag) els.bottomTag.textContent = `${String(state.currentChapter + 1).padStart(2, '0')} / ${COURSE_CHAPTERS.length}`;
    if (els.drawerCompleted) els.drawerCompleted.textContent = `${visitedCount}/${COURSE_CHAPTERS.length}`;
    if (els.drawerScore) els.drawerScore.textContent = `${pct}%`;

    const drawerTitleEl = document.querySelector('.drawer-title');
    if (drawerTitleEl) {
      drawerTitleEl.textContent = `All ${COURSE_CHAPTERS.length} Chapters`;
    }
    const statBoxes = document.querySelectorAll('.drawer-stats .stat-box');
    if (statBoxes && statBoxes.length >= 3) {
      const vidCount = COURSE_CHAPTERS.reduce((cnt, c) => cnt + ((c.blocks || []).filter(b => b.type === 'video_placeholder').length), 0);
      const vidVal = statBoxes[2].querySelector('.stat-val');
      if (vidVal) vidVal.textContent = String(vidCount);
    }

    if (els.prevBtn) els.prevBtn.disabled = state.currentChapter === 0;
    if (els.nextLabel) {
      if (state.currentChapter === COURSE_CHAPTERS.length - 1) {
        els.nextLabel.textContent = 'Finish ✓';
      } else {
        els.nextLabel.textContent = 'Next →';
      }
    }
    renderDrawerList();
  }

  function renderDrawerList() {
    els.moduleList.innerHTML = COURSE_CHAPTERS.map((ch, idx) => {
      const isDone = state.visited.includes(idx);
      const isActive = idx === state.currentChapter;
      return `
        <button class="mod-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" data-idx="${idx}">
          <span class="mod-num">${isDone && !isActive ? '✓' : ch.num}</span>
          <span class="mod-meta">
            <span class="mod-name">${ch.shortTitle}</span>
            <span class="mod-sub">${ch.title}</span>
          </span>
        </button>
      `;
    }).join('');

    els.moduleList.querySelectorAll('.mod-item').forEach(btn => {
      btn.addEventListener('click', () => {
        goToChapter(Number(btn.dataset.idx));
        closeDrawer();
      });
    });
  }

  function renderVideoStage(url) {
    if (!url) {
      return `
        <div class="play-medallion">▶</div>
        <div class="video-placeholder-text">Video Placeholder Ready to Embed</div>
        <div class="video-placeholder-sub">Set <code>embedUrl</code> in <code>js/courseData.js</code> or paste an MP4 / embed link below to preview</div>
      `;
    }
    const clean = url.trim();
    if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(clean)) {
      return `<video src="${escapeHtml(clean)}" controls playsinline preload="metadata"></video>`;
    }
    return `<iframe src="${escapeHtml(clean)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderAudioBar(audioUrl, audioTitle) {
    if (!audioUrl || !String(audioUrl).trim()) return '';
    const label = audioTitle || 'Audio Narration';
    const cleanUrl = escapeHtml(String(audioUrl).trim());
    return `
      <div class="card-speaker-corner">
        <button type="button" class="card-audio-speaker-btn" data-audio-src="${cleanUrl}" data-title="${escapeHtml(label)}" title="${escapeHtml(label)} (Tap to Play/Pause)" aria-label="Play audio narration">
          <svg class="speaker-svg speaker-idle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="speaker-svg speaker-playing" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1"></rect>
            <rect x="14" y="5" width="4" height="14" rx="1"></rect>
          </svg>
        </button>
        <audio class="card-hidden-audio" preload="none" src="${cleanUrl}"></audio>
      </div>
    `;
  }

  function openExternalLink(e, url) {
    if (e && e.stopPropagation) {
      e.stopPropagation();
    }
    if (!url || url === '#' || url === 'https://') return;
    try {
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (!win || win.closed || typeof win.closed === 'undefined') {
        try {
          if (window.top && window.top !== window) {
            window.top.open(url, '_blank', 'noopener,noreferrer');
          } else {
            window.location.href = url;
          }
        } catch (tErr) {
          window.location.href = url;
        }
      }
    } catch (err) {
      try {
        if (window.top && window.top !== window) {
          window.top.open(url, '_blank', 'noopener,noreferrer');
        } else {
          window.location.href = url;
        }
      } catch (tErr) {
        window.location.href = url;
      }
    }
  }
  window.openExternalLink = openExternalLink;

  function renderBlock(block) {
    const audioHtml = renderAudioBar(block.audioUrl, block.audioTitle);

    if (block.type === 'url_redirect') {
      const targetUrl = block.url || '#';
      const displayText = block.urlText || block.heading || targetUrl;
      const safeTarget = escapeHtml(targetUrl);
      const safeText = escapeHtml(displayText);
      return `
        <section class="url-redirect-slide" onclick="openExternalLink(event, '${safeTarget}')">
          ${block.tag ? `<span class="card-tag blue">${escapeHtml(block.tag)}</span>` : '<span class="card-tag blue">External Resource</span>'}
          ${audioHtml}
          <div class="url-redirect-content">
            <div class="url-icon-wrap">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </div>
            <a href="${safeTarget}" target="_blank" rel="noopener noreferrer" class="url-main-link" onclick="openExternalLink(event, '${safeTarget}')">
              ${safeText}
            </a>
            <div class="url-address-label">${safeTarget}</div>
            <a href="${safeTarget}" target="_blank" rel="noopener noreferrer" class="url-action-btn" onclick="openExternalLink(event, '${safeTarget}')">
              <span>Open Link</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
            <p class="url-redirect-hint">Tap anywhere to open link in a new window</p>
          </div>
        </section>
      `;
    }

    if (block.type === 'image') {
      return `
        <figure class="visual-card">
          ${audioHtml}
          <img src="${block.src}" alt="${escapeHtml(block.alt)}" loading="lazy" />
          ${block.caption ? `<figcaption class="visual-caption">📊 ${block.caption}</figcaption>` : ''}
        </figure>
      `;
    }

    if (block.type === 'think') {
      return `
        <section class="card">
          <span class="card-tag amber">Reflect &amp; Think</span>
          ${audioHtml}
          <h2>${block.title}</h2>
          <p><strong>${block.prompt}</strong></p>
          <details class="acc-item" style="margin-top:10px;">
            <summary>Tap to Reveal Key Mentor Takeaway</summary>
            <div class="acc-body">${block.hint}</div>
          </details>
        </section>
      `;
    }

    if (block.type === 'card') {
      const bulletsHtml = block.bullets
        ? `<ul class="rich-list ${block.listTone || ''}">${block.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`
        : '';
      const tableHtml = block.table
        ? `<div class="table-wrap"><table class="data-table"><thead><tr>${block.table.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${block.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
        : '';
      const calloutHtml = block.callout
        ? `<div class="callout ${block.callout.type || ''}">${block.callout.text}</div>`
        : '';
      return `
        <section class="card">
          ${block.tag ? `<span class="card-tag">${block.tag}</span>` : ''}
          ${audioHtml}
          <h2>${block.heading}</h2>
          ${block.body || ''}
          ${bulletsHtml}
          ${tableHtml}
          ${calloutHtml}
        </section>
      `;
    }

    if (block.type === 'accordion') {
      return `
        <section class="card">
          ${block.tag ? `<span class="card-tag">${block.tag}</span>` : ''}
          ${audioHtml}
          <h2>${block.heading}</h2>
          <div class="acc-group">
            ${block.items.map((it, idx) => `
              <details class="acc-item" ${idx === 0 ? 'open' : ''}>
                <summary>${it.title}</summary>
                <div class="acc-body">${it.content}</div>
              </details>
            `).join('')}
          </div>
        </section>
      `;
    }

    if (block.type === 'video_placeholder') {
      const activeUrl = state.videoPreviews[block.id] || block.embedUrl || '';
      return `
        <section class="video-embed-card" id="wrap_${block.id}">
          <div class="video-header">
            <span class="video-badge">${block.badge}</span>
            <span class="video-dur">⏱ ${block.duration}</span>
          </div>
          <h2 class="video-title">${block.title}</h2>
          <div class="video-stage" id="stage_${block.id}">
            ${renderVideoStage(activeUrl)}
          </div>
          <div class="video-watch-box">
            <div class="video-watch-title">What to Watch For in This Video</div>
            <ul>${block.watchFor.map(w => `<li>${w}</li>`).join('')}</ul>
          </div>
          <div class="video-embed-tools">
            <input type="text" class="video-url-input" id="input_${block.id}" value="${escapeHtml(activeUrl)}" placeholder="Paste .mp4 path or YouTube/Vimeo/LMS embed URL..." />
            <button type="button" class="video-load-btn" data-vid-id="${block.id}">Embed / Preview</button>
          </div>
        </section>
      `;
    }

    if (block.type === 'quiz_mcq') {
      return `
        <section class="quiz-card" id="${block.id}">
          <div class="quiz-header">
            <span class="quiz-badge">INTERACTIVE CHECK</span>
          </div>
          ${audioHtml}
          <h2 style="margin:0 0 8px;font-size:17px;color:var(--hdfc-navy);">${block.title}</h2>
          ${block.questions.map((q, qi) => {
            const key = `${block.id}_q${qi}`;
            const chosen = state.answers[key];
            const answered = chosen !== undefined;
            return `
              <div class="q-block">
                <div class="q-text">${q.q}</div>
                <div class="opt-list">
                  ${q.options.map((opt, oi) => {
                    let cls = 'opt-btn';
                    if (answered) {
                      if (oi === q.correct) cls += ' correct';
                      else if (oi === chosen) cls += ' wrong';
                    }
                    return `<button type="button" class="${cls}" data-qid="${block.id}" data-qi="${qi}" data-oi="${oi}">${opt}</button>`;
                  }).join('')}
                </div>
                ${answered ? `<div class="q-feedback ${chosen === q.correct ? 'ok' : 'err'}">${chosen === q.correct ? '✓ Correct! ' : '✕ Review: '}${q.explanation}</div>` : ''}
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    if (block.type === 'quiz_blanks') {
      return `
        <section class="quiz-card" id="${block.id}">
          <div class="quiz-header"><span class="quiz-badge">FILL IN THE BLANKS</span></div>
          ${audioHtml}
          <h2 style="margin:0 0 8px;font-size:17px;color:var(--hdfc-navy);">${block.title}</h2>
          <div class="word-bank">
            ${block.wordBank.map(w => `<span class="word-chip">${w}</span>`).join('')}
          </div>
          ${block.items.map((it, bi) => {
            const key = `${block.id}_b${bi}`;
            const val = state.answers[key] || '';
            const checked = state.answers[`${block.id}_checked`];
            const isOk = val.trim().toLowerCase() === it.answer.trim().toLowerCase();
            return `
              <div class="blank-row">
                <label style="font-size:14px;font-weight:600;">${it.prompt}</label>
                <select class="blank-input ${checked ? (isOk ? 'ok' : 'err') : ''}" data-bid="${block.id}" data-bi="${bi}">
                  <option value="">-- Select Answer from Word Bank --</option>
                  ${block.wordBank.map(opt => `<option value="${escapeHtml(opt)}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
                ${checked && !isOk ? `<div class="q-feedback err">Correct answer: <strong>${it.answer}</strong></div>` : ''}
              </div>
            `;
          }).join('')}
          <button type="button" class="action-btn check-blanks-btn" data-bid="${block.id}">Check Answers</button>
        </section>
      `;
    }

    if (block.type === 'quiz_match') {
      return `
        <section class="quiz-card" id="${block.id}">
          <div class="quiz-header"><span class="quiz-badge">MATCH THE PAIR</span></div>
          ${audioHtml}
          <h2 style="margin:0 0 8px;font-size:17px;color:var(--hdfc-navy);">${block.title}</h2>
          ${block.pairs.map((p, pi) => {
            const key = `${block.id}_m${pi}`;
            const val = state.answers[key] || '';
            const checked = state.answers[`${block.id}_checked`];
            const isOk = val === p.answer;
            return `
              <div class="match-row">
                <div style="font-size:14px;font-weight:700;color:var(--hdfc-navy);">${p.left}</div>
                <select class="match-select ${checked ? (isOk ? 'ok' : 'err') : ''}" data-mid="${block.id}" data-pi="${pi}">
                  <option value="">-- Choose Best Match --</option>
                  ${block.options.map(opt => `<option value="${escapeHtml(opt)}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
                ${checked && !isOk ? `<div class="q-feedback err">Best match: <strong>${p.answer}</strong></div>` : ''}
              </div>
            `;
          }).join('')}
          <button type="button" class="action-btn check-match-btn" data-mid="${block.id}">Verify Matches</button>
        </section>
      `;
    }

    if (block.type === 'kyc_sorter') {
      return `
        <section class="quiz-card" id="${block.id}">
          <div class="quiz-header"><span class="quiz-badge">KYC DOCUMENT SORTER</span></div>
          ${audioHtml}
          <h2 style="margin:0 0 8px;font-size:17px;color:var(--hdfc-navy);">${block.title}</h2>
          <p style="font-size:14px;margin-bottom:10px;">${block.instruction}</p>
          ${block.docs.map((d, di) => {
            const key = `${block.id}_s${di}`;
            const chosen = state.answers[key];
            const answered = chosen !== undefined;
            const isCorrect = chosen === d.valid;
            return `
              <div class="sorter-item">
                <div class="sorter-doc">${d.name}</div>
                <div class="sorter-btns">
                  <button type="button" class="sort-choice ${answered && chosen === true ? (isCorrect ? 'selected-ok' : 'selected-err') : ''}" data-sid="${block.id}" data-di="${di}" data-val="true">✓ Valid Address OVD</button>
                  <button type="button" class="sort-choice ${answered && chosen === false ? (isCorrect ? 'selected-ok' : 'selected-err') : ''}" data-sid="${block.id}" data-di="${di}" data-val="false">✕ Not Address OVD</button>
                </div>
                ${answered ? `<div class="q-feedback ${isCorrect ? 'ok' : 'err'}">${isCorrect ? '✓ Spot on! ' : '✕ Note: '}${d.note}</div>` : ''}
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    if (block.type === 'flashcards') {
      return `
        <section class="card">
          <span class="card-tag green">Interactive Self-Test Cards</span>
          <h2>${block.title}</h2>
          <p style="font-size:13.5px;color:var(--muted);">Tap any card below to reveal the model answer:</p>
          ${block.cards.map(c => `
            <details class="flashcard">
              <summary class="fc-q">${c.q}</summary>
              <div class="fc-a">${c.a}</div>
            </details>
          `).join('')}
        </section>
      `;
    }

    if (block.type === 'action_commitment') {
      return `
        <section class="card">
          <span class="card-tag red">Personal Action Plan</span>
          <h2>${block.title}</h2>
          <p>${block.prompt}</p>
          <textarea id="actionNotes" class="notepad-area" placeholder="Example: Product — Current Account + Merchant QR. Q1: How do you currently accept customer UPI/card payments? ...">${escapeHtml(state.notes)}</textarea>
          <button type="button" id="saveNotesBtn" class="action-btn" style="background:var(--green);">Save Action Plan &amp; Complete Day 2 ✓</button>
        </section>
      `;
    }

    return '';
  }

  function renderChapter() {
    try {
      // Pause any currently playing audio before rendering
      document.querySelectorAll('audio').forEach(a => {
        try { if (!a.paused) a.pause(); } catch(e) {}
      });

      if (state.currentChapter < 0) state.currentChapter = 0;
      if (state.currentChapter >= COURSE_CHAPTERS.length) state.currentChapter = Math.max(0, COURSE_CHAPTERS.length - 1);
      const ch = COURSE_CHAPTERS[state.currentChapter];
      if (!ch) return;

      const blocksHtml = (ch.blocks || []).map(b => {
        try {
          return renderBlock(b);
        } catch (bErr) {
          console.warn('Block render error:', b, bErr);
          return `<section class="card"><h2>${escapeHtml(b.heading || b.title || 'Topic Card')}</h2>${b.body || ''}</section>`;
        }
      }).join('');

      const isPureUrlSlide = ch.blocks && ch.blocks.length === 1 && ch.blocks[0].type === 'url_redirect';
      if (els.main) {
        if (isPureUrlSlide) {
          const uBlock = ch.blocks[0];
          const targetUrl = uBlock.url || '#';
          const displayText = uBlock.urlText || uBlock.heading || ch.title || targetUrl;
          const safeTarget = escapeHtml(targetUrl);
          const safeText = escapeHtml(displayText);
          const audioHtml = renderAudioBar(uBlock.audioUrl, uBlock.audioTitle);
          els.main.innerHTML = `
            <div class="chapter-hero" style="margin-bottom:12px;">
              <span class="hero-kicker">CHAPTER ${state.currentChapter + 1} OF ${COURSE_CHAPTERS.length} · ${ch.num || (state.currentChapter + 1)}</span>
              <h1 class="hero-title">${escapeHtml(ch.title || displayText)}</h1>
            </div>
            <div class="url-fullpage-redirect" onclick="openExternalLink(event, '${safeTarget}')">
              ${audioHtml}
              <div class="url-redirect-content">
                <div class="url-icon-wrap">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                  </svg>
                </div>
                <div class="url-redirect-badge">External Resource</div>
                <a href="${safeTarget}" target="_blank" rel="noopener noreferrer" class="url-main-link" onclick="openExternalLink(event, '${safeTarget}')">
                  ${safeText}
                </a>
                <div class="url-address-label">${safeTarget}</div>
                <a href="${safeTarget}" target="_blank" rel="noopener noreferrer" class="url-action-btn" onclick="openExternalLink(event, '${safeTarget}')">
                  <span>Visit Website / Resource</span>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                </a>
                <p class="url-redirect-hint">Tap anywhere on this page to open link in a new window</p>
              </div>
            </div>
          `;
        } else {
          els.main.innerHTML = `
            <div class="chapter-hero">
              <span class="hero-kicker">CHAPTER ${state.currentChapter + 1} OF ${COURSE_CHAPTERS.length} · ${ch.num || (state.currentChapter + 1)}</span>
              <h1 class="hero-title">${ch.title || ''}</h1>
              <p class="hero-desc">${ch.subtitle || ''}</p>
            </div>
            ${blocksHtml}
          `;
        }
        bindDynamicEvents();
      }
      try {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (scrollErr) {}
    } catch (e) {
      console.error('Fatal renderChapter error:', e);
      if (els.main) {
        els.main.innerHTML = `<section class="card"><h2>${escapeHtml(document.title || 'Course')}</h2><p>Course content loaded.</p></section>`;
      }
    }
  }

  function bindDynamicEvents() {
    // Video Embed Preview Loader
    els.main.querySelectorAll('.video-load-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const vidId = btn.dataset.vidId;
        const input = document.getElementById(`input_${vidId}`);
        const stage = document.getElementById(`stage_${vidId}`);
        const url = input.value.trim();
        state.videoPreviews[vidId] = url;
        stage.innerHTML = renderVideoStage(url);
        persist();
      });
    });

    // MCQ
    els.main.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = `${btn.dataset.qid}_q${btn.dataset.qi}`;
        state.answers[key] = Number(btn.dataset.oi);
        persist();
        renderChapter();
      });
    });

    // Blanks
    els.main.querySelectorAll('.blank-input').forEach(sel => {
      sel.addEventListener('change', () => {
        state.answers[`${sel.dataset.bid}_b${sel.dataset.bi}`] = sel.value;
        persist();
      });
    });
    els.main.querySelectorAll('.check-blanks-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.answers[`${btn.dataset.bid}_checked`] = true;
        persist();
        renderChapter();
      });
    });

    // Match
    els.main.querySelectorAll('.match-select').forEach(sel => {
      sel.addEventListener('change', () => {
        state.answers[`${sel.dataset.mid}_m${sel.dataset.pi}`] = sel.value;
        persist();
      });
    });
    els.main.querySelectorAll('.check-match-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.answers[`${btn.dataset.mid}_checked`] = true;
        persist();
        renderChapter();
      });
    });

    // KYC Sorter
    els.main.querySelectorAll('.sort-choice').forEach(btn => {
      btn.addEventListener('click', () => {
        state.answers[`${btn.dataset.sid}_s${btn.dataset.di}`] = (btn.dataset.val === 'true');
        persist();
        renderChapter();
      });
    });

    // Card Audio Top-Right Speaker Buttons
    els.main.querySelectorAll('.card-audio-speaker-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const corner = btn.closest('.card-speaker-corner');
        const audio = corner ? corner.querySelector('audio') : null;
        if (!audio) return;

        if (audio.paused) {
          // Pause all other audio playing across the course
          document.querySelectorAll('audio').forEach(a => {
            if (a !== audio && !a.paused) {
              a.pause();
              a.currentTime = 0;
            }
          });
          document.querySelectorAll('.card-audio-speaker-btn.is-playing').forEach(b => {
            b.classList.remove('is-playing');
            b.setAttribute('title', b.getAttribute('data-title') || 'Play Voiceover');
          });

          audio.play().then(() => {
            btn.classList.add('is-playing');
            btn.setAttribute('title', 'Playing Narration (Tap to Pause)');
          }).catch(err => {
            console.warn('Audio playback error:', err);
          });

          audio.onended = () => {
            btn.classList.remove('is-playing');
            btn.setAttribute('title', btn.getAttribute('data-title') || 'Play Voiceover');
          };
          audio.onpause = () => {
            btn.classList.remove('is-playing');
            btn.setAttribute('title', btn.getAttribute('data-title') || 'Play Voiceover');
          };
        } else {
          audio.pause();
          btn.classList.remove('is-playing');
          btn.setAttribute('title', btn.getAttribute('data-title') || 'Play Voiceover');
        }
      });
    });

    // Action Commitment Save
    const notesEl = document.getElementById('actionNotes');
    const saveBtn = document.getElementById('saveNotesBtn');
    if (notesEl && saveBtn) {
      saveBtn.addEventListener('click', () => {
        state.notes = notesEl.value;
        state.completed = true;
        persist();
        saveBtn.textContent = 'Saved & Marked Completed in LMS ✓';
      });
    }
  }

  function goToChapter(idx) {
    if (idx < 0 || idx >= COURSE_CHAPTERS.length) return;
    state.currentChapter = idx;
    persist();
    renderChapter();
  }

  function openDrawer() {
    els.drawer.classList.add('open');
    els.drawer.setAttribute('aria-hidden', 'false');
    els.backdrop.classList.remove('hidden');
  }

  function closeDrawer() {
    els.drawer.classList.remove('open');
    els.drawer.setAttribute('aria-hidden', 'true');
    els.backdrop.classList.add('hidden');
  }

  els.menuBtn.addEventListener('click', openDrawer);
  els.quickIndexBtn.addEventListener('click', openDrawer);
  els.closeDrawerBtn.addEventListener('click', closeDrawer);
  els.backdrop.addEventListener('click', closeDrawer);

  els.prevBtn.addEventListener('click', () => goToChapter(state.currentChapter - 1));
  els.nextBtn.addEventListener('click', () => {
    if (state.currentChapter < COURSE_CHAPTERS.length - 1) {
      goToChapter(state.currentChapter + 1);
    } else {
      state.completed = true;
      persist();
      scormApi.finish();
      const { pct } = computeScore();
      alert(`Congratulations! SCORM 2004 module submitted.\nChapters Completed: ${state.visited.length}/${COURSE_CHAPTERS.length}\nQuiz Score: ${pct}%`);
    }
  });

  els.finishCourseBtn.addEventListener('click', () => {
    state.completed = true;
    persist();
    scormApi.finish();
    closeDrawer();
    const { pct } = computeScore();
    alert(`Course status saved as COMPLETED in SCORM 2004.\nQuiz Score: ${pct}%`);
  });

  window.addEventListener('beforeunload', () => {
    persist();
  });

  window.goToChapter = goToChapter;
  window.COURSE_CHAPTERS = COURSE_CHAPTERS;

  persist();
  renderChapter();
})();
  </script>
</body>
</html>
